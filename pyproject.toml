[project]
name = "apren-automatico-en-la-nube"
version = "0.1.0"
description = "Prediccion de la duracion de los viajes de Citi Bike (Jersey City y Hoboken)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    # MLflow 3 exige pandas<3; el repo del profesor usa pandas 2.3.3
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "pyarrow>=18.0.0",
    "mlflow>=3.1",
    "pandera>=0.20",
    "evidently>=0.7",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.4",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -q: salida corta. --strict-markers: un marcador mal escrito falla en vez de
# ignorarse en silencio (el mismo criterio del extra="forbid" de la API).
addopts = "-q --strict-markers"
